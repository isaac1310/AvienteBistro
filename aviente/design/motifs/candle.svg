<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 90" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
<!-- A PORTRAIT frame, alone in this set, and deliberately.
     Every other motif is a 110x90 landscape drawing because it sits on a line of
     text. This one flanks a four-word title down the side of a card: in a landscape
     frame the candle was 26 units of 110, so it ate 50px of width to show 15px of
     drawing -- which is what pushed the title onto four lines. Thin and tall is also
     simply what a Shabbat candle looks like. -->
<path d="M13 26 h14 v54 H13z"></path>
<path d="M9 80 h22" stroke-width="1.3"></path>
<path d="M20 22 q-7 -8 0 -18 q7 9 0 18z"></path>
<path d="M16 40 h8 M16 56 h8" stroke-width="1.1" stroke-dasharray="3 3"></path>
</svg>
