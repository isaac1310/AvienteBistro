  <rect x="5" y="5" width="54" height="54" fill="none" stroke="#a79a85" stroke-width="3"/>
  <path fill="#2a2419" d="M32 15 L45 49 L38 49 L34.5 39 L29.5 39 L26 49 L19 49 Z
                          M32 24 L29.8 33 L34.2 33 Z"/>
</svg>
