<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aviente">
  <title>Aviente — small icon</title>
  <!-- The 16-32px variant. icon.svg's double frame collapses into a smudge at this
       size, so here there is ONE frame at a weight that survives, and the A is
       fattened to hold its counter. Never scale icon.svg down to 16px; use this. -->
