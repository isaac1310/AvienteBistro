<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Aviente">
  <title>Aviente — app icon</title>
  <!-- Le Cachet reduced to what survives a 16px favicon: the ground, the double
       frame, and the A. Every glyph here is a PATH, so this renders identically with
       no fonts available, which is the whole point of an icon. The wordmark and the
       eyebrow are dropped rather than shrunk into mush.
       Cream ground, muted-stone frame, ink A — matching the cover. It was a dark
       green field with a gold frame, which is why launching the installed app showed
       TWO covers: Android painted its own splash from this icon and the manifest
       colour, then the app painted the cream one. Same artwork, one moment. -->
  <rect width="512" height="512" fill="#f7f2e9"/>
  <rect x="34" y="34" width="444" height="444" fill="none" stroke="#a79a85" stroke-width="8" opacity=".5"/>
  <rect x="60" y="60" width="392" height="392" fill="none" stroke="#a79a85" stroke-width="16"/>
  <!-- serif A, drawn: tapered stems, thin crossbar, slab serifs at the feet -->
  <path fill="#2a2419" d="
    M256 118
    L342 372
    L300 372
    L281 314
    L231 314
    L212 372
    L170 372
    Z
    M256 186 L241 282 L271 282 Z" />
  <!-- feet serifs -->
  <rect x="156" y="372" width="70" height="12" fill="#2a2419"/>
  <rect x="286" y="372" width="70" height="12" fill="#2a2419"/>
  <!-- the gold crossbar: the header rule, crossing the A -->
  <rect x="196" y="288" width="120" height="9" fill="#a79a85"/>
</svg>
