<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Aviente — La Famille, established 2018">
  <title>Aviente — Le Cachet</title>
  <!-- LE CACHET, the chosen mark. Three tiers, the way an enamel bistro plaque is
       actually set: eyebrow, name, established year.

       The wordmark is live text. That is deliberate: inside the app it renders in
       real Cormorant Garamond loaded by next/font, which is finer than anything I
       could outline by hand. For contexts with no font — favicons, PWA tiles, OG
       images — use icon.svg instead, where the A is a drawn path. -->
  <defs>
    <style>
      .ser { font-family: 'Cormorant Garamond','Cormorant','Hoefler Text',Baskerville,Georgia,serif; }
      .san { font-family: 'Jost','Avenir Next',Futura,'Helvetica Neue',Arial,sans-serif; }
    </style>
  </defs>
  <rect width="340" height="240" fill="#1e3a2f"/>
  <!-- double frame: 1px outer, 2px inner, echoing the menu card exactly -->
  <rect x="16" y="16" width="308" height="208" fill="none" stroke="#c9a961" stroke-width="1" opacity=".55"/>
  <rect x="23" y="23" width="294" height="194" fill="none" stroke="#c9a961" stroke-width="2"/>
  <!-- the divider diamond, promoted to crest -->
  <rect x="164" y="44" width="12" height="12" fill="#c9a961" transform="rotate(45 170 50)"/>
  <text class="san" x="170" y="80" fill="#c9a961" font-size="10" text-anchor="middle" letter-spacing="5">LA FAMILLE</text>
  <text class="ser" x="170" y="146" fill="#f7f2e7" font-size="58" text-anchor="middle" letter-spacing="1">Aviente</text>
  <line x1="96" y1="166" x2="244" y2="166" stroke="#c9a961" stroke-width="1" opacity=".7"/>
  <text class="san" x="170" y="192" fill="#c9a961" font-size="11" text-anchor="middle" letter-spacing="4.5">EST. 2018</text>
</svg>
