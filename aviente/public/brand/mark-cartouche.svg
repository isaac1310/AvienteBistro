<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" role="img" aria-label="Aviente — Est. la Famille">
  <title>Aviente — cartouche mark</title>
  <!-- Direction 1: LE CACHET. The enamel plaque on a bistro frontage. Mark and
       wordmark lock into one object, so it survives being placed on a photo. -->
  <defs>
    <style>
      .ser { font-family: 'Cormorant Garamond','Cormorant','Hoefler Text',Baskerville,Georgia,serif; }
      .san { font-family: 'Jost','Avenir Next',Futura,'Helvetica Neue',Arial,sans-serif; }
    </style>
  </defs>
  <rect width="340" height="220" fill="#1e3a2f"/>
  <!-- double frame, echoing the menu card's 1px + 2px rule -->
  <rect x="16" y="16" width="308" height="188" fill="none" stroke="#c9a961" stroke-width="1" opacity=".55"/>
  <rect x="23" y="23" width="294" height="174" fill="none" stroke="#c9a961" stroke-width="2"/>
  <!-- the divider diamond, promoted to crest -->
  <rect x="164" y="46" width="12" height="12" fill="#c9a961" transform="rotate(45 170 52)"/>
  <text class="ser" x="170" y="128" fill="#f7f2e7" font-size="58" text-anchor="middle" letter-spacing="1">Aviente</text>
  <line x1="86" y1="147" x2="254" y2="147" stroke="#c9a961" stroke-width="1" opacity=".7"/>
  <text class="san" x="170" y="172" fill="#c9a961" font-size="11" text-anchor="middle" letter-spacing="4.5">EST. LA FAMILLE</text>
</svg>
