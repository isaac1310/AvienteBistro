<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" role="img" aria-label="Aviente">
  <title>Aviente — diamond mark</title>
  <!-- Direction 3: LE LOSANGE. The divider diamond carries the A on its own.
       Least literal, smallest at 16px, and the only one of the three that reads
       as a symbol rather than a sign. -->
  <defs>
    <style>
      .ser { font-family: 'Cormorant Garamond','Cormorant','Hoefler Text',Baskerville,Georgia,serif; }
      .san { font-family: 'Jost','Avenir Next',Futura,'Helvetica Neue',Arial,sans-serif; }
    </style>
  </defs>
  <rect width="340" height="220" fill="#f7f2e7"/>
  <g transform="rotate(45 170 74)">
    <rect x="132" y="36" width="76" height="76" fill="#1e3a2f"/>
    <rect x="139" y="43" width="62" height="62" fill="none" stroke="#c9a961" stroke-width="1.5"/>
  </g>
  <text class="ser" x="170" y="90" fill="#f7f2e7" font-size="42" text-anchor="middle">A</text>
  <text class="ser" x="170" y="164" fill="#1e3a2f" font-size="40" text-anchor="middle" letter-spacing="1">Aviente</text>
  <text class="san" x="170" y="186" fill="#8a6d2f" font-size="9.5" text-anchor="middle" letter-spacing="4">LIVRE DE RECETTES</text>
</svg>
